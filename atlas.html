<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas · OWLT</title>
<meta name="description" content="Every place OWLT knows, in one searchable catalogue: Solar System bodies and spacecraft, stars, planetary systems, nebulae, clusters, galaxies and the largest structures.">
<link rel="stylesheet" href="css/core.css">
<style>
/* The Atlas is the card catalogue: dense, sortable, exact. Mono for every number; the selected card opens beside the drawer. */
.atl{padding-block:22px 60px}
.atl h1{font-size:clamp(28px,4vw,44px);font-stretch:118%}
.atl .lede{margin-top:6px;color:var(--mute);max-width:72ch}
.counts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;font-family:var(--f-data);font-size:12px;color:var(--faint)}
.counts b{color:var(--starlight);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;position:sticky;top:var(--nav-h);background:var(--void);padding-block:10px;z-index:4;border-bottom:1px solid var(--hair)}
.bar input[type=search]{flex:1 1 280px;min-height:38px;padding:0 12px;background:var(--dust);border:1px solid var(--hair);color:var(--starlight);font-family:var(--f-display);font-size:15px}
.bar input:focus{outline:none;border-color:var(--o3)}
.bar select{min-height:38px;background:var(--dust);border:1px solid var(--hair);color:var(--text);font-family:var(--f-display);font-size:13.5px;padding:0 8px}
.kinds{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.kinds button{background:none;border:1px solid var(--hair);color:var(--mute);font-family:var(--f-display);font-size:12.5px;padding:3px 10px;border-radius:999px;cursor:pointer}
.kinds button[aria-pressed=true]{border-color:var(--o3);color:var(--o3)}
.kinds button small{font-family:var(--f-data);font-size:10.5px;color:var(--faint);margin-left:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;margin-top:14px;align-items:start}
.tablewrap{overflow-x:auto;min-width:0}
table.cat{width:100%;border-collapse:collapse;min-width:620px}
.cat th{position:sticky;top:0;text-align:left;font-family:var(--f-display);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--faint);padding:8px 8px;border-bottom:1px solid var(--hair);background:var(--void);cursor:pointer;white-space:nowrap}
.cat th[aria-sort]{color:var(--o3)}
.cat td{padding:7px 8px;border-bottom:1px solid var(--hair2);font-family:var(--f-data);font-size:12.5px;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.cat td:first-child{font-family:var(--f-display);font-size:14px;color:var(--starlight);white-space:normal;min-width:180px}
.cat td:first-child small{display:block;font-family:var(--f-data);font-size:10.5px;color:var(--faint)}
.cat tr{cursor:pointer}
.cat tbody tr:hover td{background:rgba(255,235,196,.035)}
.cat tr[aria-selected=true] td{background:rgba(79,216,196,.07)}
.cat td.hz{color:var(--o3)}
.more{margin-top:12px;display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-size:13px;color:var(--faint)}
.card{position:sticky;top:calc(var(--nav-h) + 74px);border:1px solid var(--hair);background:var(--dust);padding:16px 18px 18px;max-height:calc(100vh - var(--nav-h) - 90px);overflow:auto}
.card .k{font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ha)}
.card h2{font-size:26px;margin-top:4px}
.card .al{font-family:var(--f-display);font-size:12.5px;color:var(--faint);margin-top:4px}
.card .lt{margin-top:12px;padding:10px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.card .lt b{display:block;font-family:var(--f-data);font-weight:400;font-size:20px;color:var(--starlight)}
.card .lt span{font-family:var(--f-display);font-size:12px;color:var(--mute)}
.card p{margin-top:12px;font-size:15px;line-height:1.55}
.card .kv{margin-top:12px}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.card .threads{margin-top:12px}
.card ul.pl{list-style:none;margin:10px 0 0;padding:0}
.card ul.pl li{padding:6px 0;border-bottom:1px solid var(--hair2);font-family:var(--f-display);font-size:13.5px}
.card ul.pl li span{display:block}
.card ul.pl li span:last-child{font-family:var(--f-data);font-size:11px;color:var(--mute);margin-top:2px}
.card ul.pl .hz{color:var(--o3)}
.card .empty{color:var(--faint);font-family:var(--f-display);font-size:14px}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}.card{position:static;max-height:none;order:-1}}
</style>
</head>
<body>
<main class="wrap atl">
  <h1>Atlas</h1>
  <p class="lede">Every place OWLT knows, from the Moon to the edge of the observable universe. Distances are light-travel times: how long ago the light you could see from each one set out.</p>
  <div class="counts" id="counts"></div>
  <div class="bar"><input type="search" id="q" placeholder="Search names and designations: Vega, M42, NGC 1300, TRAPPIST, Kepler-452…" aria-label="Search the atlas" autocomplete="off">
    <select id="sort" aria-label="Sort"><option value="ly">Nearest first</option><option value="-ly">Farthest first</option><option value="name">Name</option><option value="mag">Brightest first</option></select></div>
  <div class="kinds" id="kinds" role="group" aria-label="Kinds"></div>
  <div class="layout">
    <div><div class="tablewrap"><table class="cat" id="cat"></table></div><div class="more" id="more"></div></div>
    <aside class="card" id="card" aria-live="polite"><p class="empty">Choose a row to open its card.</p></aside>
  </div>
</main>
<script src="js/core.js"></script>
<script src="js/astro.js"></script>
<script src="js/registry.js"></script>
<script src="js/atlas.js"></script>
</body>
</html>
