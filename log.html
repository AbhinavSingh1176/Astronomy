<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ship Log · OWLT</title>
<meta name="description" content="Everything you have found on OWLT, and the rumours it points to: places, papers, terms and missions you have not reached yet.">
<link rel="stylesheet" href="css/core.css">
<style>
/* The Ship Log keeps what you have found and what it hints at. Solid marks are places you have been;
   dashed rings are rumours, things mentioned by what you found. It lives only in this browser. */
.slog{padding-block:24px 60px}
.slog h1{font-size:clamp(28px,4vw,44px);font-stretch:118%}
.slog .lede{margin-top:6px;color:var(--mute);max-width:70ch}
.tally{display:flex;flex-wrap:wrap;gap:14px 26px;margin-top:16px}
.tally div{font-family:var(--f-display);font-size:12px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.tally b{display:block;font-family:var(--f-data);font-weight:400;font-size:26px;color:var(--starlight);letter-spacing:0;text-transform:none}
.map{margin-top:20px;border:1px solid var(--hair);background:radial-gradient(900px 500px at 50% 40%,#16120f,#0b0a0c);position:relative;overflow:hidden}
.map svg{display:block;max-width:100%;height:auto}
.map .legend{padding:8px 12px 10px;border-top:1px solid var(--hair2);font-family:var(--f-display);font-size:11.5px;color:var(--faint)}
.map a text{font-family:var(--f-display);font-size:11px;fill:var(--mute)}
.map a:hover text,.map a:focus text{fill:var(--o3)}
.map a:hover circle,.map a:focus circle{stroke:var(--o3)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}
.cols h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-stretch:118%;border-bottom:1px solid var(--hair);padding-bottom:6px}
.cols ul{list-style:none;margin:0;padding:0}
.cols li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hair2)}
.cols li a{font-family:var(--f-display);font-size:14.5px;text-decoration:none;color:var(--starlight)}
.cols li a:hover{color:var(--o3)}
.cols li span{font-family:var(--f-data);font-size:11px;color:var(--faint);white-space:nowrap}
.cols .rum a{color:var(--text)}
.cols .rum a::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:1px dashed var(--bstar);margin-right:8px;vertical-align:middle}
.grp{margin-top:14px;font-family:var(--f-display);font-size:11.5px;color:var(--ha);letter-spacing:.08em;text-transform:uppercase}
.danger{margin-top:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-display);font-size:13px;color:var(--faint)}
.empty{margin-top:18px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap slog">
  <h1>Ship Log</h1>
  <p class="lede">Everything you have found here, and the rumours it points to. Every place you open, paper you read, term you look up and mission you remember is logged in this browser only; nothing is sent anywhere.</p>
  <div class="tally" id="tally"></div>
  <div class="map" id="map"></div>
  <div class="cols"><section class="rum"><h2>Rumours worth chasing</h2><div id="rum"></div></section><section><h2>Found</h2><div id="found"></div></section></div>
  <div class="danger" id="danger"></div>
</main>
<script src="js/core.js"></script>
<script src="js/log.js"></script>
</body>
</html>
