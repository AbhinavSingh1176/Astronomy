<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Lost · OWLT</title>
<meta name="description" content="Missions that failed, ended early, never flew, or cost lives: what each was for, how far it got, and what happened.">
<link rel="stylesheet" href="css/core.css">
<style>
/* The Lost is a memorial: one quiet line through time, a mark for each mission, and the record written plainly.
   Nothing moves here. A filled mark is for lives lost; hollow for spacecraft lost; half for missions ended early; broken for missions that never flew. */
.mem{max-width:900px;margin:0 auto;padding:34px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px))}
.mem h1{font-size:clamp(30px,4.6vw,50px);font-stretch:100%;font-weight:600;letter-spacing:.01em}
.mem .lede{margin-top:12px;color:var(--mute);font-size:17px;max-width:62ch}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;font-family:var(--f-display);font-size:12.5px;color:var(--mute)}
.mk{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
.mk.crew{background:var(--ha)} .mk.lost{border:1.5px solid var(--starlight)} .mk.ended{background:linear-gradient(90deg,var(--starlight) 50%,transparent 50%);border:1.5px solid var(--starlight)} .mk.cancelled{border:1.5px dashed var(--faint)}
.line{position:relative;margin-top:30px;padding-left:34px}
.line::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--hair)}
.yr{font-family:var(--f-data);font-size:12px;color:var(--faint);margin:26px 0 8px -34px;padding-left:22px;position:relative}
.yr::before{content:"";position:absolute;left:1px;top:50%;width:9px;height:1px;background:var(--hair)}
.m{position:relative;padding:14px 0 18px;border-bottom:1px solid var(--hair2);scroll-margin-top:calc(var(--nav-h) + 20px)}
.m .mk{position:absolute;left:-34px;top:21px;width:11px;height:11px}
.m h2{font-size:21px;font-stretch:100%;font-weight:600;line-height:1.2}
.m .who{margin-top:4px;font-family:var(--f-display);font-size:13px;color:var(--mute)}
.m .who b{color:var(--ha);font-weight:600}
.m .why{margin-top:8px;font-size:16px;color:var(--text)}
.m details{margin-top:8px}
.m summary{cursor:pointer;font-family:var(--f-display);font-size:13px;color:var(--bstar);list-style:none}
.m summary::-webkit-details-marker{display:none}
.m summary::before{content:"+ ";color:var(--faint)}
.m details[open] summary::before{content:"– "}
.m dl{margin:10px 0 0;display:grid;grid-template-columns:150px 1fr;gap:8px 18px}
.m dt{font-family:var(--f-display);font-size:12.5px;color:var(--faint)}
.m dd{margin:0;font-size:15.5px;line-height:1.55}
.m .light{margin-top:10px;font-family:var(--f-display);font-size:12.5px;color:var(--faint)}
.m .threads{margin-top:10px}
.m.today{background:linear-gradient(90deg,rgba(232,68,44,.06),transparent 70%)}
.m.today .who::after{content:" · on this day";color:var(--ha)}
.m:target{background:rgba(255,235,196,.035)}
@media (max-width:600px){.m dl{grid-template-columns:1fr;gap:2px}.m dd{margin-bottom:8px}}

/* ── the retro skin, kept quiet: the keys on the console, and the record typed on an index card from the archive ── */
.key{gap:8px}
.m details[open] dl{margin-top:12px;padding:16px 18px 14px;gap:0 18px;color:#2b2119;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(transparent 0 25px,rgba(120,90,60,.16) 25px 26px),linear-gradient(#efe6cf,#e6dbc0);background-position:0 16px,0 0}
.m details[open] dt{font-family:var(--f-type);font-weight:700;font-size:12px;line-height:26px;letter-spacing:.06em;text-transform:uppercase;color:#7a2a1c}
.m details[open] dd{font-family:var(--f-type);font-size:15px;line-height:26px;color:#2b2119}
.m details[open] dd a{color:#7d1d12}
.mk.crew{box-shadow:0 0 8px rgba(232,68,44,.45)}
@media (max-width:600px){.m details[open] dl{grid-template-columns:1fr;gap:0}.m details[open] dd{margin-bottom:0}}
</style>
</head>
<body>
<main class="mem">
  <h1>The Lost</h1>
  <p class="lede">Missions that failed, ended before their time, were cancelled before they flew, or cost the lives of the people who flew them. What each was for, how far it got, and what happened, from the official record where there is one.</p>
  <div class="key" id="key" role="group" aria-label="Show"></div>
  <div class="line" id="line"></div>
</main>
<script src="js/core.js"></script>
<script src="js/lost.js"></script>
</body>
</html>
