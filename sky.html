<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Observatory · OWLT</title>
<meta name="description" content="Your sky tonight: a live star chart for where you are, rise and set times, twilight, the Moon, the planets, meteor showers and space-station passes.">
<link rel="stylesheet" href="css/core.css">
<style>
/* The Observatory is a planisphere on a brass mount beside an observer's almanac.
   The chart is the sky overhead as you would hold it: north at the top, east on the left. */
.obs{--brass:#B08D57;--brass2:#7d6340;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;padding-block:22px 50px;align-items:start}
.obs h1{font-size:clamp(28px,4vw,44px);font-stretch:118%}
.loc{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin-top:6px;font-family:var(--f-display);font-size:14px;color:var(--mute)}
.loc b{color:var(--starlight);font-weight:600}
.loc button{background:none;border:0;padding:0;color:var(--bstar);font:inherit;text-decoration:underline;text-underline-offset:.18em;cursor:pointer}
.picker{margin-top:10px;padding:12px;border:1px solid var(--hair);background:var(--dust)}
.picker input{width:100%;min-height:36px;padding:0 10px;background:var(--void);border:1px solid var(--hair);color:var(--starlight);font-family:var(--f-display);font-size:14px}
.picker input:focus{outline:none;border-color:var(--o3)}
.picker ul{list-style:none;margin:8px 0 0;padding:0;max-height:220px;overflow:auto}
.picker li button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair2);padding:7px 2px;color:var(--text);font-family:var(--f-display);font-size:14px;cursor:pointer}
.picker li button:hover{color:var(--o3)}
.picker .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mount{position:relative;margin-top:16px;aspect-ratio:1;max-width:760px;width:100%;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,transparent 63%,var(--brass2) 63.4%,var(--brass) 64.6%,#5a4630 66.5%,#2a2117 70%,transparent 70.5%)}
.mount canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;cursor:crosshair;touch-action:none}
.tip{position:absolute;pointer-events:none;background:#000;border:1px solid var(--hair);padding:5px 8px;font-family:var(--f-display);font-size:12.5px;color:var(--starlight);white-space:nowrap;transform:translate(10px,-50%);z-index:3}
.tip small{display:block;font-family:var(--f-data);font-size:10.5px;color:var(--mute)}
.scrub{display:flex;align-items:center;gap:12px;margin-top:14px;max-width:760px}
.scrub input[type=range]{flex:1;accent-color:var(--brass)}
.scrub .t{font-family:var(--f-data);font-size:13px;color:var(--starlight);min-width:13ch;text-align:right;font-variant-numeric:tabular-nums}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.alm h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-stretch:118%;border-bottom:1px solid var(--brass2);padding-bottom:6px;margin-top:22px}
.alm h2:first-child{margin-top:0}
.alm table{width:100%;border-collapse:collapse;margin-top:6px}
.alm td{padding:7px 0;border-bottom:1px solid var(--hair2);font-family:var(--f-display);font-size:14px;vertical-align:top}
.alm td:not(:first-child){font-family:var(--f-data);font-size:12.5px;color:var(--starlight);text-align:right;white-space:nowrap;padding-left:10px}
.alm td small{display:block;font-family:var(--f-display);font-size:11.5px;color:var(--faint)}
.alm .note{margin-top:8px;font-size:14.5px;line-height:1.5;color:var(--text)}
.alm .hl{border:1px solid rgba(176,141,87,.5);background:rgba(176,141,87,.06);padding:12px 14px;margin-top:10px}
.alm .hl b{color:var(--starlight);font-family:var(--f-display)}
.focus-card{margin-top:14px;padding:12px 14px;border:1px solid rgba(79,216,196,.4);background:rgba(79,216,196,.05)}
.focus-card h3{font-size:17px}
.focus-card p{margin-top:4px;font-size:14.5px}
@media (max-width:980px){.obs{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main class="wrap obs">
  <section>
    <h1>Observatory</h1>
    <div class="loc" id="loc"></div>
    <div class="picker" id="picker" hidden>
      <input id="cityQ" type="search" placeholder="Find a city…" aria-label="Find a city" autocomplete="off">
      <ul id="cityL"></ul>
      <div class="row"><button class="btn" id="geo" type="button">Use my device’s location</button><span class="stamp" id="geoMsg"></span></div>
    </div>
    <div id="focus"></div>
    <div class="mount" id="mount"><canvas id="sky" width="1520" height="1520" aria-label="Star chart of the sky above you"></canvas><div class="tip" id="tip" hidden></div></div>
    <div class="scrub"><input type="range" id="scrub" min="0" max="1440" step="5" value="0" aria-label="Time"><span class="t" id="scrubT"></span></div>
    <div class="toggles"><button class="btn" id="tLines" type="button" aria-pressed="true">Constellations</button><button class="btn" id="tNames" type="button" aria-pressed="true">Names</button><button class="btn" id="tNow" type="button">Now</button></div>
  </section>
  <section class="alm" id="alm" aria-label="Tonight’s almanac"></section>
</main>
<script src="vendor/satellite.min.js"></script>
<script src="js/core.js"></script>
<script src="js/astro.js"></script>
<script src="js/sky.js"></script>
</body>
</html>
